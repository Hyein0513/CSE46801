<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chocolate Sales Data Table</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/table.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      cursor: pointer;
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    tr.selected {
      background-color: #d0f0c0;
    }
    input.filter {
      width: 95%;
      padding: 5px;
      margin-bottom: 5px;
    }
    .pagination {
      margin-top: 10px;
      text-align: center;
    }
    .pagination button {
      padding: 5px 10px;
      margin: 0 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Chocolate Sales Data</h2>
  <div id="table-container"></div>
</body>
</html>
